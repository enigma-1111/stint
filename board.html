<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15120f" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f3ead9" media="(prefers-color-scheme: light)" />
  <meta name="color-scheme" content="dark light" />
  <title>Stint — the board</title>
  <meta name="description" content="Who has paid a line in the penny story. Rank is stints, then letters." />
  <link rel="canonical" href="https://stint-tau.vercel.app/board" />
  <meta property="og:title" content="Stint — the board" />
  <meta property="og:description" content="Who has paid a line in the penny story." />
  <meta property="og:url" content="https://stint-tau.vercel.app/board" />
  <meta property="og:image" content="https://stint-tau.vercel.app/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Stint — the board" />
  <meta name="twitter:image" content="https://stint-tau.vercel.app/og.png" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="loop.css" />
  <link rel="stylesheet" href="board.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <p class="mark">Stint</p>
      <h1 class="lede">The board.</h1>
      <p class="sub">Who paid a line. Rank is stints, then letters. Same name again is another stint.</p>
      <p class="census" id="census">Loading the book…</p>
      <div class="jump-row">
        <a class="btn primary small" href="/">Back to the story</a>
      </div>
    </header>

    <section class="tools card">
      <div class="tool-row">
        <div class="chips" id="sorts" role="tablist" aria-label="Sort the board">
          <button type="button" class="chip on" data-sort="stints">Stints</button>
          <button type="button" class="chip" data-sort="letters">Letters</button>
          <button type="button" class="chip" data-sort="name">Name</button>
        </div>
      </div>
    </section>

    <section class="card board-card">
      <ol class="board" id="board"></ol>
      <p class="hint" id="empty">No paid names yet.</p>
    </section>
  </main>
  <script src="board.js"></script>
</body>
</html>
