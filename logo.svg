  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#foil)" stroke-width="5"/>
  <circle cx="256" cy="256" r="154" fill="none" stroke="url(#foil)" stroke-width="2.2" opacity="0.85"/>
  <text x="256" y="276" text-anchor="middle" font-size="72" font-family="Georgia, Times New Roman, serif" fill="url(#foil)" letter-spacing="6">STINT</text>
</svg>
